name: Docsy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.121.2'
          extended: true
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check the checked-in Markdown
        run: npm test
      - name: Verify the documented Markdown fix command
        shell: bash
        run: |
          npm run lint:markdown-fix
          git diff --exit-code -- '*.md' 'content/**/*.md'
      - name: Check patched Markdown parser consumers
        shell: bash
        run: |
          markdown_fixture="$(mktemp -d)"
          trap 'rm -rf "$markdown_fixture"' EXIT
          printf '%s\n' '---' 'contract: synthetic' '---' \
            '# Synthetic parser contract' '' 'Inline math $x^2$.' \
            > "$markdown_fixture/parser.md"
          npx --offline --no-install markdownlint-cli2 "$markdown_fixture/parser.md"
      - name: Audit locked tooling for high-severity advisories
        run: npm audit --audit-level=high --ignore-scripts
      - name: Build the production repository
        run: npm run build
      - name: Exercise the production Docsy stylesheet
        run: npm run test:build
      - name: Check the actual Netlify Make entries and indexing guards
        if: runner.os == 'Linux'
        env:
          DEPLOY_PRIME_URL: https://example.invalid/
        run: |
          make non-production-build
          grep -Fxq '  X-Robots-Tag: noindex' public/_headers
          make deploy-preview
          grep -Fxq '  X-Robots-Tag: noindex' public/_headers
          make production-build
          printf '/*\n  X-Robots-Tag: noindex\n' > public/_headers
          if HUGO_ENV=production make check-headers-file; then
            echo 'Production incorrectly accepted noindex output'
            exit 1
          fi
