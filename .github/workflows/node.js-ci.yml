name: Docsy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.121.2'
          extended: true
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check the checked-in Markdown
        run: npm test
      - name: Build the production repository
        run: npm run build
      - name: Exercise the production Docsy stylesheet
        run: npm run test:build
